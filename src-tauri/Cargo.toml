[package]
name = "trashly"
version = "0.3.0"
description = "Trashly — a Mac cleaner"
authors = ["ganin"]
edition = "2021"
license = "AGPL-3.0-or-later"

[lib]
name = "trashly_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
tauri-plugin-prevent-default = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sysinfo = "0.33"
trash = "5"
walkdir = "2"
rayon = "1"
dirs = "5"
glob = "0.3"
base64 = "0.22"
regex = "1"
blake3 = "1"
image = "0.25"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
